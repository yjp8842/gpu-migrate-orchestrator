# LexAI 네이티브(A→A), AWS→GCP. Beetle 추천 · 생성 · 데이터 이관.
# GCP 서울에는 T4 사양이 없어 L4(g2-standard-4)로 간다 — 판정(데이터 보존)에는 영향 없음.
case: aws-to-gcp-lexai-a
workload: lexai-a
source:
  tumblebug: default
  ns: default
  infra: lexai-src-aws                # MapUI 로 만든 소스 (Running · 데이터 적재 끝)
target:
  provider: beetle
  tumblebug: default
  csp: gcp
  region: asia-northeast3
  zone: null
  ns: default
  name: lx-gcp                        # Beetle nameSeed 앞부분 (run 마다 뒤에 시각이 붙는다)
  spec: null
  image: null
policy:
  gpu: same-model-first
  image: source                      # 소스와 같은 OS · 버전 (LexAI 소스는 Ubuntu 22.04)
  root_disk_gb: 100
  open_ports:
    - { port: 3000, cidr: "${GMP_WEB_ALLOW_CIDR}" }   # 네이티브 LexAI 프론트엔드는 3000 (80 아님)
  on_perf_fail: stop
transfer:
  method: beetle
  strategy: direct
run:
  env:
    LLM_TEMPERATURE: "0"   # 백업 전에 소스 AI 서버를 이 값으로 다시 띄운다 (어댑터 restart) — 답변 문장 비교의 전제
    LLM_SEED: "42"
    COMPARE: "1"           # 이번 회차의 비교 행(migration-compare.csv)이 없으면 FAIL
    RUN_VERIFY: "1"        # 이관 때도 verify.sh 를 돌려 결과표(results.csv)를 남긴다
  golden: true
  rebuild_before_backup: true
  timeout_start_min: 75
  on_existing: stop
cleanup: keep
