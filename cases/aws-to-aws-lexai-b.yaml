# LexAI Docker Compose(B→B), AWS→AWS. Beetle 추천 · 생성 · 데이터 이관.
case: aws-to-aws-lexai-b
workload: lexai-b
source:
  tumblebug: default
  ns: default
  infra: lexai-compose-aws            # MapUI 로 만든 소스 (Running · 데이터 적재 끝이어야 실제 실행 가능 — 10/23 현재 Terminated)
target:
  provider: beetle
  tumblebug: default
  csp: aws
  region: ap-northeast-2
  zone: null
  ns: default
  name: lxc-aws                       # Beetle nameSeed 앞부분 (run 마다 뒤에 시각이 붙는다)
  spec: null
  image: null
policy:
  gpu: same-model-first
  image: source                      # 소스와 같은 OS · 버전 (LexAI 소스는 Ubuntu 22.04)
  root_disk_gb: 100
  open_ports:
    - { port: 80, cidr: "${GMP_WEB_ALLOW_CIDR}" }
  on_perf_fail: stop
transfer:
  method: beetle
  strategy: direct
run:
  env:
    LLM_TEMPERATURE: "0"   # 백업 전에 소스 AI 서버를 이 값으로 다시 띄운다 (어댑터 restart) — 답변 문장 비교의 전제
    LLM_SEED: "42"
    COMPARE: "1"           # 이번 회차의 비교 행(migration-compare.csv)이 없으면 FAIL
    RUN_VERIFY: "1"        # 이관 때도 verify.sh 를 돌려 결과표(results.csv)를 남긴다
  golden: true
  rebuild_before_backup: true
  timeout_start_min: 75
  on_existing: stop
cleanup: suspend
