# WidgetRAG · Docker Compose(B). 실행 파일은 이미지(IMAGE_TAG)라 backup 에 실행 파일 층이 없다 —
# B 소스에서 A 타겟으로 가려면 타겟 사례의 run.env 를 CODE_SOURCE=git 으로 두어야 한다.
workload: widgetrag
form: compose
repo_raw: https://raw.githubusercontent.com/ghd329/WidgetRAG
branch: feat/20260922-change-sqlite
# 타겟 진입 — 소스에서 옮겨 온 배포 디렉토리의 deploy.sh 로 띄운다 (NO_UPDATE=1: 저장소에서 받지 않고 사본 그대로).
# deploy.sh · compose 2개 · package.sh · verify.sh · migcheck.py · .env 가 소스와 같은 버전이라 이미지 태그 · 판정 기준이 갈리지 않는다
# (LexAI Compose 와 같은 방식). 사본이 없으면 deploy.sh 가 받지 않고 멈춘다
entry: "NO_UPDATE=1 {env} bash ~/widgetrag-deploy/deploy.sh"
rebuild: null                     # compose 는 재빌드가 없다 — 결정적 설정은 .env 에 있어 재기동만 (restart)
restart: "cd ~/widgetrag-deploy && {source_env} bash deploy.sh"   # 소스용 — LLM 설정만 (COMPARE 가 붙으면 소스에서 이관 비교를 돈다)
backup: "cd ~/widgetrag-deploy && GOLDEN={golden} RUNTIME=compose COMPOSE_DIR=$HOME/widgetrag-deploy bash package.sh backup {out_dir}"
backup_out: "~/widgetrag-backup/{ts}"
package_dir: "~/widgetrag-deploy/package"
# Beetle 2건 — 패키지, 그다음 배포 디렉토리. package(위에서 받은 패키지) · snapshots(OpenSearch uid 1000 소유 — 타겟 deploy.sh 가
# 만든다) · 볼륨 백업본은 빼고 옮긴다
transfer:
  - { from: "{backup_out}/", to: "{package_dir}", fresh: true, verify: true }
  - from: "~/widgetrag-deploy/"
    to: "~/widgetrag-deploy"
    exclude: [package, snapshots, "upload-data.bak-*"]
results:
  csv: "~/widgetrag-run/results.csv"
  compare: "~/widgetrag-run/migration-compare.csv"
  evidence: "~/widgetrag-run/migration-*"
logs:
  run: "~/tc-run.log"
  exit: "~/tc-run.exit"
proc_pattern: "widgetrag-deploy/deploy.sh"   # 기동 중인 진입 한 줄을 찾는 pgrep -f 패턴 (이미 돌면 다시 띄우지 않는다)
package_marker: MANIFEST.txt     # package.sh backup 이 마지막에 쓰는 파일 — 있으면 재개 때 backup 을 건너뛴다
resume_unit: widgetrag-compose-resume
# 판정 단계가 타겟에서 받아 run 폴더 verify/target/ 에 두는 것 — 판정과 무관하게 받는다 (테스트 이력)
diagnostics:
  - { name: services.log, command: "cd ~/widgetrag-deploy && sudo docker compose -f docker-compose.yml -f docker-compose.images.yml logs --no-color --timestamps | tail -n 50000" }
  - { name: containers.txt, command: "cd ~/widgetrag-deploy && sudo docker compose -f docker-compose.yml -f docker-compose.images.yml ps -a" }
  - { name: gpu.txt, command: "nvidia-smi; nvidia-smi --query-gpu=name,driver_version,memory.used,memory.total --format=csv" }
  - { name: models.txt, command: "cd ~/widgetrag-deploy && sudo docker compose -f docker-compose.yml -f docker-compose.images.yml exec -T llm sh -c 'ollama list; ollama ps'" }
services: [opensearch, llm, ai-server, backend, frontend]
identify:
  compose: [~/widgetrag-deploy/docker-compose.yml, ~/widgetrag-deploy/docker-compose.images.yml]
  env_file: ~/widgetrag-deploy/.env               # 키 목록만
  tree: ~/widgetrag-deploy
  packages: [docker-ce, nvidia-container-toolkit]
ports: { web: 80 }
health: "http://127.0.0.1:8000/health"
